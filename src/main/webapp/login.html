<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Ceris</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/mobile.css">

    <!-- CELULAR/TABLET: a Cerita (mascote) deixa de ficar na frente do texto.
         Se preferir, mova este bloco para o final do css/login.css -->
    <style>
        @media (max-width: 1100px) {
            /* card sempre empilhado (lado roxo em cima, formulário embaixo) */
            body.pagina-login .login-cartao {
                flex-direction: column !important;
                min-height: 0 !important;
                border-radius: 28px;
            }
            body.pagina-login .login-form { width: 100% !important; }

            /* lado roxo vira uma coluna: logo, frase, Cerita e botão Sair, um embaixo do outro */
            body.pagina-login .login-lateral {
                display: flex !important;
                flex-direction: column;
                align-items: flex-start;
                width: 100%;
                min-height: 0 !important;
                padding: 24px;
            }

            body.pagina-login .login-marca { gap: 16px; }
            body.pagina-login .login-icone { width: 56px; height: 56px; border-radius: 14px; }
            body.pagina-login .login-icone img { width: 28px; }
            body.pagina-login .login-nome { font-size: 28px; }

            body.pagina-login .login-frase {
                position: relative;
                z-index: 2;
                max-width: 100%;
                margin-top: 20px;
                font-size: 17px;
                line-height: 1.25;
            }

            /* Cerita no fluxo normal da página (antes ficava absolute por cima do texto) */
            body.pagina-login .login-mascote {
                position: static !important;
                display: block;
                width: auto;
                height: 230px !important;
                max-width: 100%;
                margin: 20px auto 0;
            }

            /* botão Sair embaixo da Cerita, sem encostar nela */
            body.pagina-login .login-sair {
                position: static !important;
                width: 100%;
                justify-content: center;
                margin-top: 20px;
            }
            body.pagina-login .login-sair:hover,
            body.pagina-login .login-sair:focus-visible,
            body.pagina-login .login-sair:active { transform: scale(1.03); }

            /* reforço: especificidade máxima, caso o mobile.css tente mandar a Cerita de volta pra cima do texto */
            html body.pagina-login main.login-cartao aside.login-lateral img.login-mascote {
                position: static !important;
                left: auto !important;
                bottom: auto !important;
                display: block !important;
                height: 230px !important;
                width: auto !important;
                margin: 20px auto 0 !important;
            }
            html body.pagina-login main.login-cartao aside.login-lateral a.login-sair {
                position: static !important;
                right: auto !important;
                bottom: auto !important;
                width: 100% !important;
                margin-top: 20px !important;
            }
        }
    </style>
</head>
<body class="pagina-login">

<main class="login-cartao">

    <!-- Lado roxo -->
    <aside class="login-lateral">
        <div class="login-marca">
            <span class="login-icone"><img src="assests/elements.svg" alt="Logo Ceris"></span>
            <span class="login-nome">Ceris</span>
        </div>

        <p class="login-frase">Simplifique o controle das suas filiais e transforme dados operacionais em crescimento estratégico.</p>

        <img class="login-mascote" src="assests/image%204%20%5BVectorized%5D.svg" alt="Mascote do Ceris">

        <a href="index.html" class="login-sair">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            Sair
        </a>
    </aside>
    <!-- Formulário -->
    <section class="login-form">
        <h1>Bem-vindo(a) de volta!</h1>
        <p class="login-sub">Acesse sua conta empresarial</p>

        <form id="form-login" action="login" method="post">
            <label for="email">E-mail corporativo</label>
            <input type="email" id="email" name="email" placeholder="seuemail@empresa.com" required>

            <label for="senha">Senha</label>
            <div class="campo-senha">
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                <button type="button" class="ver-senha" id="ver-senha" aria-label="Mostrar senha">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>

            <a href="#" class="esqueci">Esqueci minha senha</a>

            <button type="submit" class="botao-entrar">Entrar na conta</button>
        </form>

        <p class="login-cadastro">Ainda não tem conta corporativa? <a href="#">Cadastre-se</a></p>
    </section>

</main>
<script>
    // mostrar / esconder senha
    const campoSenha = document.getElementById('senha');
    document.getElementById('ver-senha').addEventListener('click', () => {
        campoSenha.type = campoSenha.type === 'password' ? 'text' : 'password';
    });
</script>
</body>
</html>
