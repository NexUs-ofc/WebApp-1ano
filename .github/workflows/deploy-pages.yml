name: Deploy da landing no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/main/webapp/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Buscar código
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar landing
        run: |
          mkdir -p _site/JS

          cp src/main/webapp/*.html _site/
          cp -R src/main/webapp/css _site/css
          cp -R src/main/webapp/assets _site/assets
          cp -R src/main/webapp/assests _site/assests

          cp src/main/webapp/WEB-INF/JS/proposito.js _site/JS/
          cp src/main/webapp/WEB-INF/JS/equipe.js _site/JS/

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
