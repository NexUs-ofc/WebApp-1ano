
name: Deploy da landing no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Buscar código
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar landing
        run: |
          mkdir -p _site/JS

          cp src/main/webapp/*.html _site/

          for pasta in css assets assests; do
            if [ -d "src/main/webapp/$pasta" ]; then
              cp -R "src/main/webapp/$pasta" "_site/$pasta"
            fi
          done

          if [ -d "src/main/webapp/JS" ]; then
            cp -R src/main/webapp/JS/. _site/JS/
          fi

          if [ -d "src/main/webapp/WEB-INF/JS" ]; then
            cp -R src/main/webapp/WEB-INF/JS/. _site/JS/
          fi

          touch _site/.nojekyll

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
